<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima - KevWeb!</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/clima.css" />
    <!--Conexión con Google Fonts para el uso de fuentes de textos externas-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- jQuery con Cloudflare -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <div class="header-top">
          <h1 class="nombre-logo">KevWeb!</h1>

          <div class="logo-container">
            <img src="media/logo_kev_web_no_placa.png" alt="Logo KevWeb" />
          </div>
        </div>

        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="company.html">Empresa</a></li>
            <li><a href="products.html">Productos</a></li>
            <li><a href="offers.html">Oferta del Mes</a></li>
            <li><a href="location.html">Localización</a></li>
            <li><a href="contact.html">Contacto</a></li>
            <li><a href="news.html">Noticias</a></li>
            <li><a href="weather.html" class="active">Clima</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="container-main">
      <main class="main clima-main">
        <h2 class="clima-title">Reporteador de Clima</h2>

        <div class="clima-search">
          <input
            type="text"
            id="ciudadInput"
            placeholder="Ingresa el nombre de la ciudad (ej: Quito, Ecuador)"
            class="ciudad-input"
          />
          <button id="btnBuscarClima" class="btn-clima">Buscar Clima</button>
        </div>

        <!-- Indicador de carga -->
        <div id="loading" class="loading" style="display: none">
          <div class="spinner"></div>
          <p>Cargando Datos.</p>
        </div>

        <div id="errorMsg" class="error-msg" style="display: none">
          <p id="errorText"></p>
        </div>

        <!-- Tarjeta del Clima -->
        <div id="climaCard" class="clima-card" style="display: none">
          <div class="clima-header">
            <h3 class="ciudad-nombre" id="ciudadNombre"></h3>
            <p class="pais-nombre" id="paisNombre"></p>
            <p class="fecha-actual" id="fechaActual"></p>
          </div>

          <!-- Temperatura principal -->
          <div class="clima-temperatura">
            <div class="temp-principal">
              <span class="temp-numero" id="temperatura"></span>
              <span class="temp-simbolo">°C</span>
            </div>
            <div class="clima-icono">
              <img id="climaIcono" src="" alt="Icono del clima" />
            </div>
          </div>

          <div class="clima-descripcion">
            <p id="descripcionClima"></p>
          </div>

          <div class="clima-detalles">
            <div class="detalle-card">
              <div class="detalle-info">
                <span class="detalle-label">Humedad</span>
                <span class="detalle-valor" id="humedad"></span>
              </div>
            </div>

            <div class="detalle-card">
              <div class="detalle-info">
                <span class="detalle-label">Viento</span>
                <span class="detalle-valor" id="viento"></span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer>
      <p>
        &copy; Kevin López - 2026 KevWeb! - Todos los derechos reservados.
        &copy;
      </p>
    </footer>
  </body>
  <script src="js/clima.js"></script>
</html>
